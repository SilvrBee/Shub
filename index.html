<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadence — Personal Dashboard</title>
    <meta
      name="description"
      content="A clean, structured personal dashboard for daily priorities, time-blocked scheduling, focus sessions, habits, and notes."
    />
    <meta property="og:title" content="Cadence — Personal Dashboard" />
    <meta
      property="og:description"
      content="A clean, structured personal dashboard for daily priorities, time-blocked scheduling, focus sessions, habits, and notes."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var settingsRaw = localStorage.getItem('cadence_settings');
          var settings = settingsRaw ? JSON.parse(settingsRaw) : null;
          var validStyles = {
            classic: true,
            editorial: true,
            'aurora-glass': true,
            celestial: true,
          };
          var darkOnlyStyles = { celestial: true };
          var rawStyle = settings && typeof settings.style === 'string' ? settings.style : 'classic';
          if (rawStyle === 'editorial-atelier') rawStyle = 'editorial';
          var style = validStyles[rawStyle] ? rawStyle : 'classic';
          document.documentElement.setAttribute('data-style', style);

          var colorMode = (settings && settings.colorMode) || localStorage.getItem('cadence_theme');
          if (darkOnlyStyles[style]) {
            document.documentElement.classList.add('dark');
          } else if (colorMode === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (colorMode === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
          if (settings && settings.theme) {
            document.documentElement.setAttribute('data-theme', settings.theme);
          }
          if (settings && settings.density) {
            document.documentElement.setAttribute('data-density', settings.density);
          }
          if (settings && settings.highContrast) {
            document.documentElement.classList.add('high-contrast');
          }
          if (settings && settings.reducedMotion) {
            document.documentElement.classList.add('reduce-motion');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-[#0B0F17] dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
